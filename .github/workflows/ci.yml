name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      # The security claim in the README is only worth anything if it is
      # re-verified on every commit.
      - name: Verify every adversary scenario is still blocked
        run: python -m tobira.cli attack --quiet

      - name: Upload control verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-verification-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: ignore
